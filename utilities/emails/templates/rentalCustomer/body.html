<p style="line-height: 175%; margin: 0 0 14px 0; color: #333333; font-size: 15px;">{greeting}</p>
<p style="line-height: 175%; margin: 0 0 14px 0; color: #333333; font-size: 15px;">{intro}</p>
<table role="presentation" style="border-collapse: collapse; margin: 0 0 14px 0; font-size: 15px; color: #333333;">
  <tr><td style="padding: 4px 16px 4px 0; color: #777777;">{labelNumber}</td><td style="padding: 4px 0;"><strong>{number}</strong></td></tr>
  <tr><td style="padding: 4px 16px 4px 0; color: #777777;">{labelCar}</td><td style="padding: 4px 0;">{categoryName}</td></tr>
  <tr><td style="padding: 4px 16px 4px 0; color: #777777;">{labelPickup}</td><td style="padding: 4px 0;">{pickupAt}<br>{pickupLocation}</td></tr>
  <tr><td style="padding: 4px 16px 4px 0; color: #777777;">{labelReturn}</td><td style="padding: 4px 0;">{returnAt}<br>{returnLocation}</td></tr>
  <tr><td style="padding: 4px 16px 4px 0; color: #777777;">{labelTotal}</td><td style="padding: 4px 0;"><strong>{total}</strong></td></tr>
</table>
<p style="line-height: 175%; margin: 0 0 14px 0; color: #333333; font-size: 15px;"><a href="{manageUrl}">{manageLinkText}</a></p>
<p style="line-height: 175%; margin: 0; color: #333333; font-size: 15px;">{closing}</p>
